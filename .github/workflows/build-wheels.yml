name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One abi3 wheel per platform covers every CPython from 3.10 up. Before abi3
# each wheel was pinned to a single minor version and only the versions this
# matrix happened to build could install; on everything else `pip install
# moofile` silently resolved backwards to 0.2.1 — the last release from before
# the Rust core existed — instead of failing. Keep the abi3 floor, the
# `requires-python` in pyproject.toml, and the `abi3-py310` feature in
# bindings/python/Cargo.toml in step with each other.

jobs:
  # ── Native wheels (Rust core), one abi3 wheel per platform ────
  native:
    name: wheel ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          # Native ARM runner rather than cross-compilation: the embedding
          # engine pulls a C/C++ toolchain through llama-gguf, which is what
          # made cross-builds fail here before.
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Pin the build interpreter so the wheel tag is deterministic
      # (cp310-abi3) instead of tracking whatever the runner image ships.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          args: --release --out dist
          # manylinux_2_28 (AlmaLinux 8, glibc 2.28, GCC 12) — NOT 2_17.
          # Building against the 2014-era 2_17 toolchain compiles std::regex
          # (used by ONNX Runtime's PCI device discovery) against GCC 4.9
          # libstdc++ headers (GLIBCXX <= 3.4.19). On hosts with a modern
          # libstdc++ (e.g. Ubuntu 22.04+ / 6.0.3x) that ABI-mismatched regex
          # code null-derefs inside regex_traits::transform -> segfault on
          # auto_embed model load. Compiled against GCC 12 (GLIBCXX 3.4.30)
          # the regex code is compatible with current libstdc++ runtimes.
          # 2_28 still covers every supported distro (glibc >= 2.28).
          manylinux: "2_28"
          before-script-linux: |
            yum install -y openssl-devel || apt-get update && apt-get install -y libssl-dev || true

      - name: Check the wheel is abi3 and installable
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/
          # PyPI rejects bare linux_* tags; a repaired manylinux wheel should
          # be the only linux artifact here.
          rm -f dist/*-linux_x86_64.whl dist/*-linux_aarch64.whl
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "expected exactly one wheel, got: ${wheels[*]}" >&2
            exit 1
          fi
          case "${wheels[0]}" in
            *cp310-abi3-*) echo "OK: ${wheels[0]}" ;;
            *) echo "not an abi3 wheel: ${wheels[0]} — is abi3-py310 still enabled?" >&2; exit 1 ;;
          esac
          python -m pip install --upgrade pip
          pip install "${wheels[0]}"
          cd /tmp
          python -c "
          import moofile
          assert moofile._NATIVE_LOADED, 'native extension did not load from the wheel'
          db = moofile.Collection('smoke.bson', indexes=['k'])
          db.insert({'k': 'a', 'n': 1})
          assert db.find({'n': {'\$gte': 1}}).count() == 1
          db.close()
          print('smoke test OK on', moofile.__version__)
          "

      # The point of abi3 is that a wheel built against 3.10 runs on later
      # interpreters. Assert it rather than assume it — this is the property
      # the whole platform matrix now rests on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the abi3 wheel runs on a newer Python
        shell: bash
        run: |
          set -euo pipefail
          python -VV
          python -m pip install --upgrade pip
          pip install dist/*.whl
          cd /tmp
          python -c "
          import moofile, sys
          assert moofile._NATIVE_LOADED, 'abi3 wheel failed to load on ' + sys.version
          print('abi3 forward-compat OK on', sys.version.split()[0])
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

  # ── Pure-Python wheel: the floor under everything above ───────
  # Covers musl/Alpine, Intel macOS, and any platform not built above. This
  # job used to write its setuptools config to pyproject.toml.bak and never
  # move it into place, so it built through maturin and produced a native
  # wheel that the publish job then deleted — no pure-Python wheel has
  # reached PyPI since 0.3.1.
  pure-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pure-Python wheel
        run: |
          pip install build
          python scripts/build_pure_wheel.py --outdir dist

      - name: Check it is genuinely pure Python
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/
          test -f dist/*-py3-none-any.whl
          if python -m zipfile -l dist/*-py3-none-any.whl | grep -qE '\.(so|pyd|dylib)'; then
            echo "pure-Python wheel contains a compiled extension" >&2
            exit 1
          fi
          pip install dist/*-py3-none-any.whl
          cd /tmp
          python -c "
          import moofile
          assert not moofile._NATIVE_LOADED, 'pure wheel should not load a native extension'
          db = moofile.Collection('smoke.bson', indexes=['k'])
          db.insert({'k': 'a'})
          assert db.count({}) == 1
          db.close()
          print('pure-Python smoke test OK on', moofile.__version__)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pure
          path: dist/

  # ── Publish to PyPI (only on tag push) ───────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, pure-python]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      # A missing artifact is the failure mode this whole file exists to
      # prevent: it does not break the release, it quietly narrows platform
      # coverage, and pip then serves an old version instead of erroring.
      - name: Verify the full artifact set is present
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/
          missing=0
          for pattern in \
            "*-cp310-abi3-manylinux*x86_64.whl" \
            "*-cp310-abi3-manylinux*aarch64.whl" \
            "*-cp310-abi3-macosx*arm64.whl" \
            "*-cp310-abi3-win_amd64.whl" \
            "*-py3-none-any.whl"
          do
            # shellcheck disable=SC2086
            if ! compgen -G "dist/$pattern" > /dev/null; then
              echo "MISSING: $pattern" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "refusing to publish an incomplete set" >&2; exit 1; }
          echo "all expected artifacts present"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: true
