name: Release native libraries

# Builds libmoofile for every supported platform and attaches the results to
# the GitHub Release.  Python gets its own wheels from build-wheels.yml; this
# job serves every other language, all of which need the shared library at
# runtime.
#
# Each archive contains:
#   include/moofile.h, include/moofile.hpp
#   lib/<libmoofile.so|dylib|moofile.dll>   (plus the import .lib on Windows)
#   LICENSE, README
#
# Run manually (workflow_dispatch) to smoke-test without cutting a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (for example v1.0.2)"
        required: true
        default: "v1.0.2"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            rust-target: x86_64-unknown-linux-gnu
            lib: libmoofile.so
          - os: macos-14          # Apple Silicon runner
            target: macos-aarch64
            rust-target: aarch64-apple-darwin
            lib: libmoofile.dylib
          - os: windows-latest
            target: windows-x86_64
            rust-target: x86_64-pc-windows-msvc
            lib: moofile.dll

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build libmoofile
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: cargo build --release -p moofile-c --target ${{ matrix.rust-target }}

      # Sanity check: the archive is worthless if the symbols are missing.
      # 30 exported moofile_* functions are expected.
      - name: Verify exports (Unix)
        if: runner.os != 'Windows'
        run: |
          LIB="target/${{ matrix.rust-target }}/release/${{ matrix.lib }}"
          test -f "$LIB" || { echo "::error::$LIB not produced"; exit 1; }
          if [ "${{ runner.os }}" = "Linux" ]; then
            COUNT=$(nm -D --defined-only "$LIB" | grep -c ' T moofile_' || true)
          else
            COUNT=$(nm -gU "$LIB" | grep -c ' T _moofile_' || true)
          fi
          echo "exported moofile_* symbols: $COUNT"
          [ "$COUNT" -ge 30 ] || { echo "::error::expected >=30 exports, got $COUNT"; exit 1; }

      - name: Verify exports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lib = "target/${{ matrix.rust-target }}/release/${{ matrix.lib }}"
          if (-not (Test-Path $lib)) { throw "$lib not produced" }
          Write-Host "built $lib ($((Get-Item $lib).Length) bytes)"

      - name: Stage archive contents
        shell: bash
        run: |
          STAGE="moofile-${{ matrix.target }}"
          mkdir -p "$STAGE/include" "$STAGE/lib"
          cp bindings/c/include/moofile.h bindings/c/include/moofile.hpp "$STAGE/include/"
          cp "target/${{ matrix.rust-target }}/release/${{ matrix.lib }}" "$STAGE/lib/"
          # Windows also needs the import library to link against.
          if [ -f "target/${{ matrix.rust-target }}/release/moofile.dll.lib" ]; then
            cp "target/${{ matrix.rust-target }}/release/moofile.dll.lib" "$STAGE/lib/moofile.lib"
          fi
          cp LICENSE "$STAGE/" 2>/dev/null || true
          cat > "$STAGE/README.txt" <<'TXT'
          MooFile native library
          ======================

          include/  C header (moofile.h) and C++ wrapper (moofile.hpp)
          lib/      the shared library

          Point a binding at it with the MOOFILE_LIB environment variable:

              export MOOFILE_LIB=/path/to/lib/libmoofile.so

          Java uses a system property instead:

              java -Dmoofile.library.path=/path/to/lib/libmoofile.so ...

          To link C or C++ against it:

              cc myapp.c -Iinclude -Llib -lmoofile

          Autoembedding is compiled in.  See https://github.com/patw/moofile
          TXT

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: tar czf "moofile-${{ matrix.target }}.tar.gz" "moofile-${{ matrix.target }}"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "moofile-${{ matrix.target }}" -DestinationPath "moofile-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            moofile-*.tar.gz
            moofile-*.zip

  java:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build Java binding JAR
        run: bash bindings/java/build.sh jar

      - uses: actions/upload-artifact@v4
        with:
          name: java-jar
          path: bindings/java/build/moofile-java-*.jar

  publish:
    needs: [build, java]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: java-jar
          path: dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum moofile-*.tar.gz moofile-*.zip moofile-java-*.jar > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/moofile-*.tar.gz
            dist/moofile-*.zip
            dist/moofile-java-*.jar
            dist/SHA256SUMS

  # ── npm ───────────────────────────────────────────────────────────
  # One package carrying every platform binary (~16 MB compressed). Simpler
  # and more robust than per-platform optionalDependencies at this scale, and
  # avoids a postinstall downloader — those break under --ignore-scripts,
  # offline, and behind proxies.
  npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/
          merge-multiple: true

      - name: Stage native libraries
        working-directory: bindings/node
        run: |
          set -euo pipefail
          # npm dir names mirror process.platform + process.arch, so the
          # runtime lookup is exact rather than a search.
          stage() {  # <archive-target> <npm-dir> <libname>
            local target="$1" dir="$2" lib="$3"
            mkdir -p "native/$dir"
            if [ -f "../../artifacts/moofile-$target.tar.gz" ]; then
              tar xzf "../../artifacts/moofile-$target.tar.gz" -C /tmp
            else
              unzip -oq "../../artifacts/moofile-$target.zip" -d /tmp
            fi
            cp "/tmp/moofile-$target/lib/$lib" "native/$dir/$lib"
          }
          stage linux-x86_64    linux-x64    libmoofile.so
          stage macos-aarch64   darwin-arm64 libmoofile.dylib
          stage windows-x86_64  win32-x64    moofile.dll
          find native -type f -exec ls -la {} +

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Version check
        working-directory: bindings/node
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          TAG="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || {
            echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }

      - name: Publish
        working-directory: bindings/node
        run: |
          # workflow_dispatch can intentionally republish native release assets
          # for an existing tag. npm versions are immutable, so treat an
          # already-published matching version as a successful no-op.
          VERSION=$(node -p "require('./package.json').version")
          if npm view "moofile@$VERSION" version \
              --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "npm package version already published; skipping."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── NuGet ─────────────────────────────────────────────────────────
  # Native assets go in runtimes/<rid>/native/; the SDK copies the matching
  # one into the consumer's output directory automatically.
  nuget:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # for NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/
          merge-multiple: true

      - name: Stage native libraries
        working-directory: bindings/csharp/Moofile
        run: |
          set -euo pipefail
          stage() {  # <archive-target> <rid> <libname>
            local target="$1" rid="$2" lib="$3"
            mkdir -p "runtimes/$rid/native"
            if [ -f "../../../artifacts/moofile-$target.tar.gz" ]; then
              tar xzf "../../../artifacts/moofile-$target.tar.gz" -C /tmp
            else
              unzip -oq "../../../artifacts/moofile-$target.zip" -d /tmp
            fi
            cp "/tmp/moofile-$target/lib/$lib" "runtimes/$rid/native/$lib"
          }
          stage linux-x86_64    linux-x64    libmoofile.so
          stage macos-aarch64   osx-arm64    libmoofile.dylib
          stage windows-x86_64  win-x64      moofile.dll
          find runtimes -type f -exec ls -la {} +

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version check
        working-directory: bindings/csharp/Moofile
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          TAG="${TAG#v}"
          PKG=$(grep -oP '(?<=<Version>)[^<]+' Moofile.csproj)
          [ "$TAG" = "$PKG" ] || {
            echo "::error::tag $TAG does not match Moofile.csproj $PKG"; exit 1; }

      - name: Pack
        working-directory: bindings/csharp/Moofile
        run: dotnet pack -c Release -o "$GITHUB_WORKSPACE/nupkg"

      # Trusted publishing: exchanges the GitHub OIDC token for a short-lived
      # API key, so no long-lived secret is stored. Set the NUGET_USER
      # repository variable to the nuget.org account name.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
