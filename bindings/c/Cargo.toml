[package]
name = "moofile-c"
version.workspace = true
edition.workspace = true
description = "C language bindings for MooFile — lightweight embedded document store"
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
name = "moofile"

[dependencies]
moofile-core = { path = "../../core", default-features = false }
bson = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[features]
default = ["embed"]
embed = ["moofile-core/embed"]  # Autoembedding: on-device GGUF inference
