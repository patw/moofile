[package]
name = "moofile-py"
version.workspace = true
edition.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
moofile-core = { path = "../../core", package = "moofile-core", default-features = false }
pyo3 = { version = "0.24", features = ["extension-module"] }
bson = "2"
serde_json = "1"

[features]
default = ["embed"]
embed = ["moofile-core/embed"]  # Autoembedding: on-device GGUF inference
