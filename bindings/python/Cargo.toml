[package]
name = "moofile-py"
version.workspace = true
edition.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
moofile-core = { path = "../../core", package = "moofile-core", default-features = false }
# abi3-py310 builds against the stable ABI, so ONE wheel per platform covers
# every CPython from 3.10 up.  Without it each wheel is pinned to a single
# minor version, and the versions CI happened to build were the only ones that
# could install: `pip install moofile` on macOS 3.12 or Windows 3.11 silently
# resolved back to 0.2.1, the last release from before the Rust core existed.
# Keep this in step with `requires-python` in pyproject.toml.
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
bson = "2"
serde_json = "1"

[features]
default = ["embed"]
embed = ["moofile-core/embed"]  # Autoembedding: on-device ONNX inference via fastembed
