[package]
name = "moofile-core"
version.workspace = true
edition.workspace = true
description = "Lightweight embedded document store — SQLite ergonomics, MongoDB-style queries"
license.workspace = true
repository = "https://github.com/patw/moofile"
keywords = ["database", "embedded", "document-store", "bson", "vector-search"]
categories = ["database-implementations", "embedded"]

[lib]
name = "moofile"
path = "src/lib.rs"

[dependencies]
bson = "2"
rust-stemmers = "1.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
getrandom = "0.3"
log = "0.4"
rayon = "1"
bincode = "1"
fs4 = "0.12"
hex = "0.4"
# Autoembedding runs voyage-4-nano through our single-model ONNX runner
# (v4nano-embed) plus ONNX Runtime and HF tokenizers. `default-features =
# false` on ort is handled inside v4nano-embed; hf-hub is only used to fetch
# the model files on first use and uses rustls, no OpenSSL.
# `--no-default-features` drops both plus the statically linked ONNX Runtime,
# taking the autoembedding surface out of the binary entirely.
v4nano-embed = { path = "../v4nano-embed", optional = true }
# `ureq` (not `tokio`/`reqwest`) + ureq's default rustls keeps this OpenSSL-free.
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }
dirs = "6"

[features]
# Autoembedding: on-device ONNX inference (voyage-4-nano) plus HuggingFace
# model downloads. On by default. `--no-default-features` drops the embedding
# runner and everything that runs a model; the config types stay available and
# any attempt to embed returns MooFileError::EmbedDisabled.
default = ["embed"]
embed = ["dep:v4nano-embed", "dep:hf-hub"]

[dev-dependencies]
tempfile = "3"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "embed_bench"
path = "examples/embed_bench.rs"

[[example]]
name = "migrate_test"
path = "examples/migrate_test.rs"
