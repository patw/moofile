[package]
name = "moofile-core"
version.workspace = true
edition.workspace = true
description = "Lightweight embedded document store — SQLite ergonomics, MongoDB-style queries"
license.workspace = true
repository = "https://github.com/patw/moofile"
keywords = ["database", "embedded", "document-store", "bson", "vector-search"]
categories = ["database-implementations", "embedded"]

[lib]
name = "moofile"
path = "src/lib.rs"

[dependencies]
bson = "2"
rust-stemmers = "1.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
getrandom = "0.3"
log = "0.4"
rayon = "1"
bincode = "1"
fs4 = "0.12"
hex = "0.4"
llama-gguf = { version = "0.14", default-features = false, features = ["cpu", "huggingface"], optional = true }
dirs = "6"

[features]
# Autoembedding: on-device GGUF inference plus HuggingFace model downloads.
# On by default.  `--no-default-features` drops llama-gguf (~300 transitive
# crates) and everything that runs a model; the config types stay available
# and any attempt to embed returns MooFileError::EmbedDisabled.
default = ["embed"]
embed = ["dep:llama-gguf"]

[dev-dependencies]
tempfile = "3"

[[example]]
name = "bench"
path = "examples/bench.rs"
