[package]
name = "moofile-core"
version.workspace = true
edition.workspace = true
description = "Lightweight embedded document store — SQLite ergonomics, MongoDB-style queries"
license.workspace = true
repository = "https://github.com/patw/moofile"
keywords = ["database", "embedded", "document-store", "bson", "vector-search"]
categories = ["database-implementations", "embedded"]

[lib]
name = "moofile"
path = "src/lib.rs"

[dependencies]
bson = "2"
rust-stemmers = "1.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
getrandom = "0.3"
log = "0.4"
rayon = "1"
bincode = "1"
fs4 = "0.12"
hex = "0.4"
# Autoembedding runs ONNX models through fastembed (ort + HF tokenizers).
# `default-features = false` drops fastembed's image-model support and swaps
# native-tls for rustls: 129 transitive crates instead of 330, and no OpenSSL
# to link against on manylinux.  It costs ~300KB of binary -- the bulk of the
# ~25MB that `embed` adds is the statically linked ONNX Runtime itself.
fastembed = { version = "5.17", default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
], optional = true }
dirs = "6"

[features]
# Autoembedding: on-device ONNX inference plus HuggingFace model downloads.
# On by default.  `--no-default-features` drops fastembed (~129 transitive
# crates and a statically linked ONNX Runtime) and everything that runs a
# model; the config types stay available and any attempt to embed returns
# MooFileError::EmbedDisabled.
default = ["embed"]
embed = ["dep:fastembed"]

[dev-dependencies]
tempfile = "3"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "embed_bench"
path = "examples/embed_bench.rs"

[[example]]
name = "migrate_test"
path = "examples/migrate_test.rs"
